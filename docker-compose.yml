services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zuno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zuno_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-zuno}
    # Bind only to loopback; the database is not exposed to the network.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - zuno_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-zuno}:${POSTGRES_PASSWORD:-zuno_dev_password}@postgres:5432/${POSTGRES_DB:-zuno}
      JWT_SECRET: ${JWT_SECRET:-zuno-local-development-secret-change-before-deploy}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      UPLOAD_DIR: /var/lib/zuno/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - zuno_uploads:/var/lib/zuno/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  zuno_postgres_data:
  zuno_uploads: